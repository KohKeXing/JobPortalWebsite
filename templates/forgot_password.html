<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobPortal - Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #0b192f 0%, #0f2a4a 50%, #0a192f 100%);
        }
        .input-focus:focus {
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            border-color: #2563eb;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
        }
        .floating-shapes {
            position: absolute;
            border-radius: 50%;
            opacity: 0.05;
            pointer-events: none;
        }
        .floating-shapes:nth-child(1) {
            width: 300px;
            height: 300px;
            background: #2563eb;
            top: -100px;
            right: -100px;
        }
        .floating-shapes:nth-child(2) {
            width: 200px;
            height: 200px;
            background: #7c3aed;
            bottom: -50px;
            left: -50px;
        }
        .floating-shapes:nth-child(3) {
            width: 150px;
            height: 150px;
            background: #06b6d4;
            top: 50%;
            left: -50px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center gradient-bg font-sans antialiased relative overflow-hidden">
    
    <div class="floating-shapes"></div>
    <div class="floating-shapes"></div>
    <div class="floating-shapes"></div>

    <div class="w-full max-w-md px-4 relative z-10">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2.5 bg-white/10 backdrop-blur-sm px-4 py-2 rounded-2xl border border-white/10 mb-4">
                <div class="h-8 w-8 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <span class="text-xl font-extrabold text-white font-display">Job<span class="text-blue-400">Portal</span></span>
            </div>
            <h1 class="text-2xl font-bold text-white font-display tracking-tight">Reset Password</h1>
            <p class="text-sm text-slate-300 mt-1">We'll send you a link to reset your password</p>
        </div>

        <!-- Forgot Password Card - Email Input Form -->
        <div class="bg-white rounded-3xl p-8 shadow-2xl shadow-black/20">
            <form id="forgotPasswordForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Email Address</label>
                    <div class="relative">
                        <div class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                        <input type="email" id="email" required 
                               class="w-full pl-10 pr-4 py-3 bg-slate-50/80 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 placeholder-slate-400 focus:outline-none input-focus transition-all"
                               placeholder="you@example.com">
                    </div>
                </div>

                <button type="submit" 
                        class="w-full btn-primary text-white font-bold py-3 rounded-xl text-sm shadow-lg shadow-blue-500/25 relative overflow-hidden group">
                    <span class="relative z-10 flex items-center justify-center gap-2">
                        Send Reset Link
                        <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
                        </svg>
                    </span>
                    <div class="absolute inset-0 bg-gradient-to-r from-blue-500 to-blue-700 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-slate-600">
                    Remember your password? 
                    <a href="{{ login_url|default('/login') }}" class="font-bold text-blue-600 hover:text-blue-800 transition hover:underline">
                        Sign in
                    </a>
                </p>
            </div>

            <div id="success" class="mt-4 hidden bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-3 rounded-xl text-sm font-semibold flex items-center gap-2.5">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span id="success-text">✅ Reset link sent! Check your email.</span>
            </div>

            <div id="error" class="mt-4 hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm font-semibold flex items-center gap-2.5">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
                <span id="error-text">Failed to send reset link</span>
            </div>
        </div>

        <p class="text-center text-xs text-white/30 mt-6 font-medium tracking-wide">
            &copy; 2026 JobPortal. All rights reserved.
        </p>
    </div>

    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const errorDiv = document.getElementById('error');
            const errorText = document.getElementById('error-text');
            const successDiv = document.getElementById('success');
            const successText = document.getElementById('success-text');
            const submitButton = e.currentTarget.querySelector('button[type="submit"]');

            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');
            submitButton.disabled = true;
            submitButton.innerHTML = 'Sending...';

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to send reset link');
                }

                successDiv.classList.remove('hidden');
                successText.textContent = data.message || '✅ Reset link sent! Check your email.';
                submitButton.innerHTML = '✅ Sent!';
                document.getElementById('email').value = '';

                setTimeout(() => {
                    submitButton.disabled = false;
                    submitButton.innerHTML = 'Send Reset Link';
                }, 3000);

            } catch (error) {
                console.error('Error:', error);
                errorDiv.classList.remove('hidden');
                errorText.textContent = error.message || 'Failed to send reset link. Please try again.';
                submitButton.disabled = false;
                submitButton.innerHTML = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
